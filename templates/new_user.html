<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill Information - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }
        h1, h2, h3, h4, h5, .navbar-brand, legend {
            font-family: 'Poppins', sans-serif;
        }
        .navbar-custom {
            background-color: #2B4C7E;
        }
        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }
        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }
        .btn-outline-back {
            border-color: #2B4C7E;
            color: #2B4C7E;
        }
        .btn-outline-back:hover {
            background-color: #2B4C7E;
            color: #fff;
        }
        .content-card {
            max-width: 620px;
            margin: 40px auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .intro-text {
            color: #6C757D;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span style="color:#F5A623;">Opportunity</span> Base
            </a>
        </div>
    </nav>

    <div class="container">

        <div class="content-card">

            <h3 class="mb-2">Fill Information</h3>
            <p class="intro-text mb-4">
                <b>Filling this information will enable our intelligent software to know you better. You are welcome to use Opportunity Base.</b>
            </p>

            <div class="mb-4">
                <a href="{{ url_for('sign_in') }}" class="btn btn-outline-back">Sign In</a>
            </div>

            <form action="/new_user" method="POST">

                <div class="mb-3">
                    <label class="form-label">Full Name:</label>
                    <input type="text" name="full_name" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Date of birth</label>
                    <input type="date" name="date_birth" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">School</label>
                    <input type="text" name="school" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Combination</label>
                    <textarea name="combination" rows="2" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Career path</label>
                    <textarea name="career_path" rows="2" class="form-control" placeholder="name future career eg Acountant,economist,teacher,banker"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Course that you are plan to take</label>
                    <textarea name="courses" rows="2" class="form-control" placeholder="write courses for you career path eg economist,banker,IT,Teacher,accountant"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="for login">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="text" name="password" class="form-control" placeholder="for login">
                </div>

                {% if message %}
                    <p class="text-danger">{{ message }}</p>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100">Register</button>

            </form>
        </div>

    </div>

</body>
</html>

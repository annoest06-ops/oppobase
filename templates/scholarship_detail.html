
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ schol.title }} - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }

        h1, h2, h3, h4, h5,
        .navbar-brand {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background-color: #2B4C7E;
        }

        .navbar-brand-accent {
            color: #F5A623;
        }

        .main-container {
            max-width: 900px;
            margin: 45px auto;
        }

        .back-button {
            color: #2B4C7E;
            border: 1px solid #2B4C7E;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .back-button:hover {
            color: #ffffff;
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }

        .scholarship-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .scholarship-header {
            background-color: #2B4C7E;
            padding: 2rem;
        }

        .scholarship-header h1 {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 0;
        }

        .scholarship-content {
            padding: 2rem;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            color: #2B4C7E;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.7rem;
        }

        .content-box {
            background-color: #F7F8FA;
            border-left: 4px solid #F5A623;
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .content-text {
            margin-bottom: 0;
            line-height: 1.8;
        }

        .action-area {
            border-top: 1px solid #e5e7eb;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        .action-title {
            font-family: 'Poppins', sans-serif;
            color: #2B4C7E;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .action-text {
            color: #6c757d;
            margin-bottom: 1.2rem;
        }

        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
            border-radius: 8px;
            padding: 0.7rem 1.7rem;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }

        @media (max-width: 576px) {
            .main-container {
                margin: 25px auto;
            }

            .scholarship-header,
            .scholarship-content {
                padding: 1.25rem;
            }

            .scholarship-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <!-- Opportunity Base Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span class="navbar-brand-accent">Opportunity</span> Base
            </a>
        </div>
    </nav>

    <div class="container main-container">

        <!-- Back Button -->
        <div class="mb-3">
            <button type="button" class="btn back-button">
                <a href="{{url_for('user_dash')}}"
                   class="text-decoration-none"
                   style="color: inherit;">
                    ← Back to Dashboard
                </a>
            </button>
        </div>

        <!-- Scholarship Card -->
        <div class="scholarship-card">

            <!-- Scholarship Title -->
            <div class="scholarship-header">
                <h1>{{ schol.title }}</h1>
            </div>

            <div class="scholarship-content">

                <!-- Description -->
                <div class="content-box">
                    <div class="section-title">
                        Description
                    </div>

                    <p
                        class="content-text"
                        style="white-space: pre-wrap; word-wrap: break-word;"
                    >
                        {{ schol.content }}
                    </p>
                </div>

                <!-- Comment -->
                <div class="content-box">
                    <div class="section-title">
                        Comment
                    </div>

                    <p
                        class="content-text"
                        style="white-space: pre-wrap; word-wrap: break-word;"
                    >
                        {{ schol.comment }}
                    </p>
                </div>

                <!-- Continue -->
                <div class="action-area">

                    <div class="action-title">
                        Ready to continue?
                    </div>

                    <p class="action-text">
                        Continue to view the scholarship questions and begin
                        working on your application.
                    </p>

                    <form action="/scholar_detail" method="POST">

                        <input
                            type="text"
                            value="{{scholar_id}}"
                            name="data_id"
                            hidden
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            View Questions →
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>
</html>

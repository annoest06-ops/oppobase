
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Scholarship Question - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }

        h1, h2, h3, h4, h5,
        .navbar-brand,
        legend {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background-color: #2B4C7E;
        }

        .navbar-brand-accent {
            color: #F5A623;
        }

        .main-container {
            max-width: 800px;
            margin: 45px auto;
        }

        .form-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .page-heading {
            color: #2B4C7E;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        legend {
            color: #2B4C7E;
            font-size: 1.25rem;
            font-weight: 600;
            float: none;
            width: auto;
            padding: 0;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 500;
            color: #33383f;
        }

        .form-control,
        .form-select {
            border: 1px solid #D7DCE2;
            border-radius: 8px;
            padding: 0.7rem 0.85rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2B4C7E;
            box-shadow: 0 0 0 0.2rem rgba(43, 76, 126, 0.15);
        }

        .question-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }

        .back-button {
            color: #2B4C7E;
            border: 1px solid #2B4C7E;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .back-button:hover {
            color: #ffffff;
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }

        .helper-text {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.35rem;
        }

        .alert-danger {
            border-radius: 8px;
        }

        @media (max-width: 576px) {
            .main-container {
                margin: 25px auto;
            }

            .form-card {
                padding: 1.25rem;
            }
        }
    </style>
</head>

<body>

    <!-- Opportunity Base Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span class="navbar-brand-accent">Opportunity</span> Base
            </a>
        </div>
    </nav>

    <div class="container main-container">

        <!-- Back Button -->
        <div class="mb-3">
            <button type="button" class="btn back-button">
                <a href="{{url_for('admin_dash')}}" class="text-decoration-none" style="color: inherit;">
                    ← Back to Admin Dashboard
                </a>
            </button>
        </div>

        <!-- Main Heading -->
        <h1 class="page-heading">Create Scholarship Question</h1>

        <!-- Form Card -->
        <div class="form-card">

            <form action="/question" method="POST">

                <fieldset>

                    <legend>Create Question</legend>

                    <!-- Scholarship -->
                    <div class="mb-4">
                        <label class="form-label">
                            Scholarship Name
                        </label>

                        <select name="ship_name" class="form-select">

                            {%if names%}

                                {%for name in names%}

                                <option value="{{name.scholar_id}}">
                                    {{name.scholar_id}} - {{name.title}}
                                </option>

                                {%endfor%}

                            {%endif%}

                        </select>
                    </div>

                    <!-- Question Number -->
                    <div class="mb-4">
                        <label class="form-label">
                            Question Number
                        </label>

                        <input
                            type="number"
                            name="qn_number"
                            class="form-control"
                            placeholder="Enter question number"
                        >

                        <div class="helper-text">
                            Example: 1, 2, 3...
                        </div>
                    </div>

                    <!-- Question -->
                    <div class="mb-4">
                        <label class="form-label">
                            Question
                        </label>

                        <textarea
                            name="question"
                            class="form-control question-textarea"
                            placeholder="Enter the scholarship essay question..."
                        ></textarea>
                    </div>

                    <!-- Word Count -->
                    <div class="mb-4">
                        <label class="form-label">
                            Word Count
                        </label>

                        <input
                            type="number"
                            name="word_count"
                            class="form-control"
                            placeholder="Enter maximum word count"
                        >

                        <div class="helper-text">
                            Specify the maximum number of words allowed.
                        </div>
                    </div>

                    <!-- Existing Message -->
                    {% if message %}
                        <div class="alert alert-danger mb-4">
                            {{ message }}
                        </div>
                    {% endif %}

                    <!-- Submit -->
                    <div class="d-flex justify-content-end">
                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Post Question
                        </button>
                    </div>

                </fieldset>

            </form>

        </div>

    </div>

</body>
</html>

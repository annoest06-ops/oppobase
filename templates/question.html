<html>

<body>

    <h1>Create scholarship question</h1><br><br>

    <button> <a href="{{url_for('admin_dash')}}">back</a></button><br>

    <form action="/question" method="POST">
        <fieldset>

            <legend>create question</legend>


            <label>scholarship name</label><br>
            
            <select name="ship_name">
            {%if names%}
                {%for name in names%}
                <option value="{{name.scholar_id}}">{{name.scholar_id}} - {{name.title}}</option>
                 {%endfor%}
            {%endif%}
            </select><br><br>
           
            <label>question number</label><br>
            <input type="number" name="qn_number"><br><br>

            <label>question</label><br>
            <textarea name="question"></textarea><br><br>

            <label>word count</label><br>
            <input type="number" name="word_count"><br><br>

            {% if message %}
                <p style="color: red;">{{ message }}</p>
            {% endif %}

            <button type="submit">post</button>


        </fieldset>
    </form>
</body>
</html>

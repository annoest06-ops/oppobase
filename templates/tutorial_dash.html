
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorials - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }

        h1, h2, h3, h4, h5,
        .navbar-brand,
        legend {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background-color: #2B4C7E;
        }

        .navbar-brand-accent {
            color: #F5A623;
        }

        .main-container {
            max-width: 900px;
            margin: 45px auto;
        }

        .page-heading {
            color: #2B4C7E;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .page-description {
            color: #6c757d;
            margin-bottom: 1.5rem;
        }

        .tutorial-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        legend {
            color: #2B4C7E;
            font-size: 1.3rem;
            font-weight: 600;
            float: none;
            width: auto;
            padding: 0;
            margin-bottom: 0.5rem;
        }

        .select-description {
            color: #6c757d;
            margin-bottom: 1.5rem;
        }

        .tutorial-option {
            display: block;
            margin-bottom: 1rem;
        }

        .tutorial-label {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            padding: 1rem 1.2rem;
            background-color: #F7F8FA;
            border: 1px solid #DDE2E8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tutorial-label:hover {
            border-color: #2B4C7E;
            box-shadow: 0 3px 12px rgba(43, 76, 126, 0.08);
        }

        .tutorial-radio {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: #2B4C7E;
        }

        .tutorial-info {
            flex: 1;
        }

        .tutorial-id {
            display: inline-block;
            background-color: #2B4C7E;
            color: #ffffff;
            border-radius: 20px;
            padding: 0.3rem 0.6rem;
            font-size: 0.78rem;
            font-weight: 500;
            margin-right: 0.5rem;
        }

        .tutorial-name {
            font-family: 'Poppins', sans-serif;
            color: #2B4C7E;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
            border-radius: 8px;
            padding: 0.7rem 1.6rem;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }

        .back-button {
            color: #2B4C7E;
            border: 1px solid #2B4C7E;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .back-button:hover {
            color: #ffffff;
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }

        @media (max-width: 576px) {
            .main-container {
                margin: 25px auto;
            }

            .tutorial-card {
                padding: 1.25rem;
            }

            .tutorial-label {
                padding: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <!-- Opportunity Base Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span class="navbar-brand-accent">Opportunity</span> Base
            </a>
        </div>
    </nav>

    <div class="container main-container">

        <!-- Back Button -->
        <div class="mb-3">
            <button type="button" class="btn back-button">
                <a href="{{url_for('user_dash')}}"
                   class="text-decoration-none"
                   style="color: inherit;">
                    ← Back to Dashboard
                </a>
            </button>
        </div>

        <!-- Page Heading -->
        <h1 class="page-heading">Tutorial Page</h1>

        <p class="page-description">
            Learn useful skills and guidance to help you prepare a stronger
            scholarship application.
        </p>

        <!-- Tutorial Selection Card -->
        <div class="tutorial-card">

            <form action="/tuto_dash" method="POST">

                <fieldset>

                    <legend>Tutorials</legend>

                    <p class="select-description">
                        Select a tutorial to continue.
                    </p>

                    {%if tp_check%}

                        {%for sum in tp_check%}

                            <div class="tutorial-option">

                                <label class="tutorial-label">

                                    <input
                                        type="radio"
                                        name="topic_ref"
                                        value="{{sum.id}}"
                                        class="tutorial-radio"
                                    >

                                    <div class="tutorial-info">

                                        <span class="tutorial-id">
                                            {{sum.id}}
                                        </span>

                                        <span class="tutorial-name">
                                            {{ sum.topic_name}}
                                        </span>

                                    </div>

                                </label>

                            </div>

                        {%endfor%}

                    {%endif%}

                    <div class="d-flex justify-content-end mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Select Tutorial →
                        </button>

                    </div>

                </fieldset>

            </form>

        </div>

    </div>

</body>
</html>

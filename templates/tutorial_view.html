
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorial View - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }

        h1, h2, h3, h4, h5,
        .navbar-brand {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background-color: #2B4C7E;
        }

        .navbar-brand-accent {
            color: #F5A623;
        }

        .main-container {
            max-width: 950px;
            margin: 45px auto;
        }

        .back-button {
            color: #2B4C7E;
            border: 1px solid #2B4C7E;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .back-button:hover {
            color: #ffffff;
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }

        .page-heading {
            color: #2B4C7E;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .tutorial-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .tutorial-header {
            background-color: #2B4C7E;
            padding: 1.75rem 2rem;
        }

        .tutorial-header h2 {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0;
        }

        .tutorial-body {
            padding: 2rem;
        }

        .info-row {
            margin-bottom: 1.25rem;
        }

        .info-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c757d;
            margin-bottom: 0.35rem;
        }

        .info-value {
            font-size: 1rem;
            color: #22262B;
        }

        .topic-id {
            display: inline-block;
            background-color: #F5A623;
            color: #ffffff;
            border-radius: 20px;
            padding: 0.3rem 0.7rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .content-section {
            margin-top: 1.75rem;
            padding-top: 1.75rem;
            border-top: 1px solid #e5e7eb;
        }

        .content-title {
            font-family: 'Poppins', sans-serif;
            color: #2B4C7E;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .content-box {
            background-color: #F7F8FA;
            border-left: 5px solid #F5A623;
            border-radius: 8px;
            padding: 1.5rem;
            line-height: 1.8;
            font-size: 1rem;
        }

        .content-box p {
            margin: 0;
        }

        @media (max-width: 576px) {
            .main-container {
                margin: 25px auto;
            }

            .tutorial-body {
                padding: 1.25rem;
            }

            .tutorial-header {
                padding: 1.25rem;
            }

            .tutorial-header h2 {
                font-size: 1.15rem;
            }

            .content-box {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Opportunity Base Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span class="navbar-brand-accent">Opportunity</span> Base
            </a>
        </div>
    </nav>

    <div class="container main-container">

        <!-- Back Button -->
        <div class="mb-3">
            <button type="button" class="btn back-button">
                <a href="{{url_for('user_dash')}}"
                   class="text-decoration-none"
                   style="color: inherit;">
                    ← Back to Dashboard
                </a>
            </button>
        </div>

        <!-- Page Heading -->
        <h1 class="page-heading">Tutorial View</h1>

        <!-- Tutorial Card -->
        <div class="tutorial-card">

            <div class="tutorial-header">
                <h2>
                    {{ content_data.topic_name }}
                </h2>
            </div>

            <div class="tutorial-body">

                <!-- Topic Unit -->
                <div class="info-row">
                    <div class="info-label">
                        Topic Unit
                    </div>

                    <div class="info-value">
                        <span class="topic-id">
                            {{ content_data.id }}
                        </span>
                    </div>
                </div>

                <!-- Topic Number -->
                <div class="info-row">
                    <div class="info-label">
                        Topic Number
                    </div>

                    <div class="info-value">
                        {{ content_data.topic_number }}
                    </div>
                </div>

                <!-- Topic Title -->
                <div class="info-row">
                    <div class="info-label">
                        Topic Title
                    </div>

                    <div class="info-value">
                        {{ content_data.topic_name }}
                    </div>
                </div>

                <!-- Content -->
                <div class="content-section">

                    <div class="content-title">
                        Tutorial Content
                    </div>

                    <div
                        class="content-box"
                        style="white-space: pre-wrap; word-wrap: break-word;"
                    >
                        <p>{{ content_data.content_body }}</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>

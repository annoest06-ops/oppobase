
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question View - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }

        h1, h2, h3, h4, h5,
        .navbar-brand,
        .question-title,
        .feedback-title {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background-color: #2B4C7E;
        }

        .navbar-brand-accent {
            color: #F5A623;
        }

        .main-container {
            max-width: 900px;
            margin: 45px auto;
        }

        .page-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        .back-button {
            color: #2B4C7E;
            border: 1px solid #2B4C7E;
            background-color: #ffffff;
        }

        .back-button:hover {
            color: #ffffff;
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }

        .page-heading {
            color: #2B4C7E;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .question-box {
            background-color: #F7F8FA;
            border-left: 5px solid #F5A623;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .question-label {
            font-size: 0.85rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 0;
        }

        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }

        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }

        .feedback-section {
            margin-top: 1.5rem;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .feedback-icon {
            width: 38px;
            height: 38px;
            background-color: #F5A623;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .feedback-title {
            color: #2B4C7E;
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .feedback-card {
            background-color: #F7F8FA;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 1.5rem;
        }

        .feedback-item {
            margin-bottom: 1rem;
        }

        .feedback-item:last-child {
            margin-bottom: 0;
        }

        .feedback-item strong {
            color: #2B4C7E;
        }

        .essay-answer {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1rem;
            line-height: 1.7;
            margin-top: 0.5rem;
        }

        .divider {
            margin: 2rem 0;
        }

        @media (max-width: 576px) {
            .main-container {
                margin: 25px auto;
            }

            .page-card {
                padding: 1.25rem;
            }

            .question-text {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Opportunity Base Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <span class="navbar-brand-accent">Opportunity</span> Base
            </a>
        </div>
    </nav>

    <div class="container main-container">

        <div class="page-card">

            <!-- Back Button -->
            <div class="mb-4">
                <button type="button" class="btn back-button">
                    <a href="{{url_for('user_dash')}}" class="text-decoration-none" style="color: inherit;">
                        ← Back to Dashboard
                    </a>
                </button>
            </div>

            <!-- Page Heading -->
            <h1 class="page-heading">Question View</h1>

            <!-- Current Question -->
            <div class="question-box">
                <div class="question-label">Scholarship Question</div>

                <p class="question-text">
                    {{view.number}}: {{view.question}}
                </p>
            </div>

            <!-- Existing Form -->
            <form action="/question_view" method="POST">

                <input
                    type="text"
                    value="{{view.number}}"
                    name="question_no"
                    hidden
                >

                <input
                    type="text"
                    value="{{view.question}}"
                    name="question"
                    hidden
                >

                <input
                    type="text"
                    value="{{view.scholar_id}}"
                    name="scholarship_id"
                    hidden
                >

                <button
                    type="submit"
                    name="action"
                    value="understand"
                    class="btn btn-primary px-4 py-2"
                >
                    Understand
                </button>

            </form>

            <hr class="divider">

            <!-- Intelligent Analysis Feedback -->
            <div class="feedback-section">

                <div class="feedback-header">
                    <div class="feedback-icon">AI</div>

                    <h2 class="feedback-title">
                        Intelligent Analysis Feedback
                    </h2>
                </div>

                <div class="feedback-card">

                    <div class="feedback-item">
                        <strong>Question Number:</strong>
                        <div class="mt-1">
                            {{question_no}}
                        </div>
                    </div>

                    <div class="feedback-item">
                        <strong>Question:</strong>
                        <div class="mt-1">
                            {{question}}
                        </div>
                    </div>

                    <div class="feedback-item">
                        <strong>AI Analysis / Prompt:</strong>

                        <div
                            class="essay-answer"
                            style="white-space: pre-wrap; word-wrap: break-word;"
                        >
                            <p class="mb-0">{{question_prompt}}</p>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>

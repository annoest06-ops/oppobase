<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Example - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }
        h1, h2, h3, h4, h5, .navbar-brand, legend {
            font-family: 'Poppins', sans-serif;
        }
        .navbar-custom {
            background-color: #2B4C7E;
        }
        .admin-badge {
            background-color: #F5A623;
            color: #22262B;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }
        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }
        .btn-outline-back {
            border-color: #2B4C7E;
            color: #2B4C7E;
        }
        .btn-outline-back:hover {
            background-color: #2B4C7E;
            color: #fff;
        }
        .content-card {
            max-width: 800px;
            margin: 30px auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        legend {
            font-weight: 600;
            font-size: 1.3rem;
            color: #2B4C7E;
            margin-bottom: 1rem;
            float: none;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('admin_dash') }}">
                <span style="color:#F5A623;">Opportunity</span> Base
                <span class="admin-badge">ADMIN</span>
            </a>
        </div>
    </nav>

    <div class="container">

        <div class="mt-3">
            <a href="{{ url_for('admin_dash') }}" class="btn btn-outline-back">&larr; Back</a>
        </div>

        <div class="content-card">
            <h3 class="mb-4">Search Example</h3>

            <form action="/update_example" method="POST">
                <fieldset>
                    <div class="mb-3">
                        <label class="form-label">Search topic name:</label>
                        <select name="topic_name" class="form-select">
                            {% if eg_name %}
                            {% for name in eg_name %}
                                <option>Topic name</option>
                                <option value="{{ name.topic_name }}">{{ name.topic_name }}</option>
                            {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Search example number:</label>
                        <select name="example_number" class="form-select">
                            <option>example number</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>

                    <button type="submit" name="action" value="search_example" class="btn btn-primary">Search</button>
                </fieldset>
            </form>
        </div>

        <div class="content-card">
            <form action="/update_example" method="POST">
                <fieldset>

                    <legend>Edit Example</legend>

                    {% if eg_value %}

                    <div class="mb-3">
                        <label class="form-label">Topic</label>
                        <select name="topic" class="form-select">
                            <option>Topic name</option>
                            <option value="{{ eg_value.topic_id }}">{{ eg_value.topic_id }}</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Name:</label>
                        <input type="text" name="eg_name" value="{{ eg_value.name }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Country</label>
                        <select name="country" class="form-select">
                            <option value="{{ eg_value.country }}">{{ eg_value.country }}</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Applying to</label>
                        <input type="text" name="apply_to" value="{{ eg_value.college }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Skills</label>
                        <input type="text" name="skills" value="{{ eg_value.skills }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Achievements</label>
                        <textarea name="achieve" rows="6" class="form-control">{{ eg_value.achieves }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Avatar</label>
                        <input type="text" name="avatar" value="{{ eg_value.avatar }}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Question</label>
                        <textarea rows="8" class="form-control">{{ eg_value.question }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Response</label>
                        <textarea rows="10" class="form-control">{{ eg_value.response }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Word count</label>
                        <input type="number" name="word_count" value="eg_value.word_count" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Example number</label>
                        <select name="eg_no" class="form-select">
                            <option value="{{ eg_value.example_no }}">{{ eg_value.example_no }}</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Comment</label>
                        <textarea name="comment" rows="6" class="form-control">{{ eg_value.comment }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Update</button>

                    {% endif %}
                </fieldset>
            </form>
        </div>

    </div>

</body>
</html>

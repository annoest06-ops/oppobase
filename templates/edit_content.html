<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Content - Opportunity Base</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F8FA;
            font-family: 'Inter', sans-serif;
            color: #22262B;
        }
        h1, h2, h3, h4, h5, .navbar-brand, legend {
            font-family: 'Poppins', sans-serif;
        }
        .navbar-custom {
            background-color: #2B4C7E;
        }
        .admin-badge {
            background-color: #F5A623;
            color: #22262B;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        .btn-primary {
            background-color: #2B4C7E;
            border-color: #2B4C7E;
        }
        .btn-primary:hover {
            background-color: #1F3A61;
            border-color: #1F3A61;
        }
        .btn-outline-back {
            border-color: #2B4C7E;
            color: #2B4C7E;
        }
        .btn-outline-back:hover {
            background-color: #2B4C7E;
            color: #fff;
        }
        .content-card {
            max-width: 800px;
            margin: 30px auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        legend {
            font-weight: 600;
            font-size: 1.3rem;
            color: #2B4C7E;
            margin-bottom: 1rem;
            float: none;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('admin_dash') }}">
                <span style="color:#F5A623;">Opportunity</span> Base
                <span class="admin-badge">ADMIN</span>
            </a>
        </div>
    </nav>

    <div class="container">

        <div class="mt-3">
            <a href="{{ url_for('admin_dash') }}" class="btn btn-outline-back">&larr; Back</a>
        </div>

        <div class="content-card">
            <h3 class="mb-4">Search Content</h3>

            <form action="/edit_content" method="POST">
                <fieldset>
                    <div class="mb-3">
                        <label class="form-label">Search topic name:</label>
                        <select name="topic_name" class="form-select">
                            <option>Topic name</option>

                            {% if search_name %}
                            {% for names in search_name %}
                                <option value="{{ names.topic_name }}">{{ names.topic_name }}</option>
                            {% endfor %}
                            {% endif %}

                        </select>
                    </div>

                    <button type="submit" name="action" value="search_by_name" class="btn btn-primary">Search</button>
                </fieldset>
            </form>
        </div>

        {% if content %}
        <div class="content-card">

            <form action="/edit_content" method="POST">
                <fieldset>

                    <legend>Edit Content</legend>

                    <p class="text-muted">Content ID: {{ content.id }}</p>

                    <input type="hidden" name="content_id" value="{{ content.id }}">

                    <div class="mb-3">
                        <label class="form-label">Topic Number:</label>
                        <input type="text" value="{{ content.topic_number }}" name="topic_number" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Topic Name</label>
                        <input type="text" value="{{ content.topic_name }}" name="topic_name" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Body</label>
                        <textarea name="body" rows="10" class="form-control">{{ content.content_body }} </textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Example status</label>
                        <select name="example" class="form-select">
                            <option value="{{ content.example }}">{{ content.example }}</option>
                            <option value="available">Available</option>
                            <option value="none">None</option>
                        </select>
                    </div>

                    <button type="submit" name="action" value="update_from_name" class="btn btn-primary w-100">Update</button>

                </fieldset>
            </form>
        </div>
        {% endif %}

    </div>

</body>
</html>
